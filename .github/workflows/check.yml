name: Release integrity and portability
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B verify_release.py
      - run: python -B -m unittest structured_kan.tests.test_portability -v
